<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee5">
  <title>Starbucks meetup</title>
  <style>
    :root {
      --green: #006241;
      --green-dark: #003b2b;
      --green-soft: #dff2e9;
      --cream: #f4eee5;
      --paper: #fffdf8;
      --coffee: #6f4e37;
      --ink: #17332a;
      --muted: #64756f;
      --line: #d9ded8;
      --shadow: 0 1px 0 rgba(19, 51, 42, .04), 0 16px 50px rgba(30, 61, 50, .13);
      --radius: 28px;
      --pointer-x: 50%;
      --pointer-y: 35%;
    }

    * { box-sizing: border-box; }

    html { color-scheme: light; }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(255,255,255,.92) 0 8%, transparent 27%),
        radial-gradient(circle at 86% 78%, rgba(223,242,233,.85) 0 11%, transparent 32%),
        var(--cream);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      transition: background-position .2s ease;
    }

    .ambient { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .aurora {
      position: absolute;
      width: 55vmax;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .2;
      mix-blend-mode: multiply;
      animation: aurora 14s ease-in-out infinite alternate;
    }
    .aurora.one { left: -24vmax; top: -25vmax; background: #78c9a6; }
    .aurora.two { right: -26vmax; bottom: -27vmax; background: #d8ac7d; animation-delay: -7s; }
    .bean {
      position: absolute;
      width: 22px;
      height: 32px;
      border-radius: 48% 52% 48% 52%;
      background: linear-gradient(135deg, #9a6d4d, #5f3c29);
      opacity: .2;
      animation: drift 10s ease-in-out infinite alternate;
      filter: drop-shadow(0 9px 10px rgba(66, 35, 20, .12));
    }
    .bean::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 10px;
      width: 2px;
      height: 25px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      transform: rotate(15deg);
    }
    .bean:nth-child(1) { left: 7%; top: 14%; transform: rotate(26deg); }
    .bean:nth-child(2) { right: 8%; top: 22%; transform: rotate(-38deg) scale(.8); animation-delay: -3s; }
    .bean:nth-child(3) { left: 12%; bottom: 10%; transform: rotate(64deg) scale(.7); animation-delay: -7s; }
    .bean:nth-child(4) { right: 13%; bottom: 12%; transform: rotate(8deg) scale(1.1); animation-delay: -5s; }

    main { width: min(100%, 520px); position: relative; z-index: 1; }

    .card {
      position: relative;
      overflow: hidden;
      background: rgba(255, 253, 248, .97);
      border: 1px solid rgba(0, 98, 65, .1);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: arrive .7s cubic-bezier(.2,.8,.2,1) both;
      transform-style: preserve-3d;
      transition: transform .25s ease, box-shadow .25s ease;
      will-change: transform;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 4;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 20%), rgba(255,255,255,.32), transparent 30%);
      transition: opacity .25s ease;
    }
    .card.tilting::after { opacity: 1; }

    .scene {
      min-height: 205px;
      position: relative;
      display: grid;
      place-items: end center;
      padding: 24px;
      background: linear-gradient(160deg, var(--green-dark), var(--green));
      isolation: isolate;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 63%, rgba(127, 215, 174, .3), transparent 32%),
        linear-gradient(145deg, #002f22, var(--green) 72%, #007d54);
    }
    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      z-index: -1;
    }
    .scene::before { width: 260px; height: 260px; right: -115px; top: -135px; }
    .scene::after { width: 150px; height: 150px; left: -65px; bottom: -80px; }

    .scene-grid {
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .16;
      background-image:
        linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: linear-gradient(to bottom, transparent, black 38%, transparent);
      transform: perspective(220px) rotateX(62deg) scale(1.35) translateY(46px);
      animation: gridFlow 8s linear infinite;
    }
    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: twinkle 2.4s ease-in-out infinite;
    }
    .spark:nth-of-type(1) { left: 16%; top: 24%; }
    .spark:nth-of-type(2) { right: 19%; top: 18%; animation-delay: -.8s; }
    .spark:nth-of-type(3) { right: 28%; top: 48%; animation-delay: -1.6s; }
    .spark:nth-of-type(4) { left: 25%; top: 56%; animation-delay: -.35s; }

    .cup-wrap { position: relative; width: 130px; height: 150px; animation: hoverCup 4s ease-in-out infinite; }
    .cup-wrap::after {
      content: "";
      position: absolute;
      left: 17px;
      right: 8px;
      bottom: -9px;
      height: 17px;
      border-radius: 50%;
      background: rgba(0, 20, 13, .32);
      filter: blur(7px);
      z-index: -1;
      animation: cupShadow 4s ease-in-out infinite;
    }
    .cup {
      position: absolute;
      left: 20px;
      bottom: 0;
      width: 92px;
      height: 108px;
      background: #f8f1e8;
      border-radius: 8px 8px 28px 28px;
      box-shadow: inset -10px 0 0 rgba(0,0,0,.04), 0 10px 20px rgba(0,0,0,.2);
      animation: cupIn .8s .15s cubic-bezier(.2,.9,.25,1.2) both;
    }
    .cup::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 32px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: inset 0 0 0 7px #f8f1e8;
    }
    .cup::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 42px;
      right: -24px;
      top: 18px;
      border: 9px solid #f8f1e8;
      border-left: 0;
      border-radius: 0 50% 50% 0;
    }
    .coffee {
      position: absolute;
      left: 21px;
      top: -4px;
      width: 90px;
      height: 15px;
      border-radius: 50%;
      background: #795238;
      border: 4px solid #f8f1e8;
      z-index: 2;
      overflow: hidden;
    }
    .coffee::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 8px;
      left: 14px;
      top: 0;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 50%;
      animation: coffeeRipple 2.8s ease-out infinite;
    }
    .steam { position: absolute; inset: 0; }
    .steam span {
      position: absolute;
      bottom: 116px;
      width: 12px;
      height: 45px;
      border-radius: 50%;
      border-left: 3px solid rgba(255,255,255,.72);
      filter: blur(.3px);
      animation: steam 2.4s ease-out infinite;
    }
    .steam span:nth-child(1) { left: 46px; }
    .steam span:nth-child(2) { left: 67px; animation-delay: -.8s; }
    .steam span:nth-child(3) { left: 87px; animation-delay: -1.55s; }

    .content { padding: 30px 30px 28px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 40px); line-height: 1.05; letter-spacing: -.045em; text-wrap: balance; }
    .lead { margin: 13px 0 24px; color: var(--muted); line-height: 1.55; font-size: 15px; text-wrap: pretty; }
    .eyebrow, h1, .lead, form > * { animation: riseIn .55s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { animation-delay: .22s; }
    h1 { animation-delay: .29s; }
    .lead { animation-delay: .36s; }
    form > *:nth-child(1) { animation-delay: .43s; }
    form > *:nth-child(2) { animation-delay: .5s; }
    form > *:nth-child(3) { animation-delay: .57s; }
    form > *:nth-child(4) { animation-delay: .64s; }
    form > *:nth-child(5) { animation-delay: .71s; }

    form { display: grid; gap: 18px; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    legend, label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 800; }
    .quick-days { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; pointer-events: none; }
    .chip span {
      min-height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .chip input:checked + span { border-color: var(--green); background: var(--green-soft); box-shadow: inset 0 0 0 1px var(--green), 0 7px 18px rgba(0,98,65,.12); animation: selected .35s cubic-bezier(.2,.9,.2,1.3); }
    .chip input:focus-visible + span { outline: 3px solid rgba(0,98,65,.25); outline-offset: 2px; }
    .chip span:hover { transform: translateY(-2px); border-color: var(--green); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type="date"], input[type="time"], input[type="text"] {
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      color: var(--ink);
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    input:focus { outline: 0; border-color: var(--green); box-shadow: 0 0 0 4px rgba(0,98,65,.12); }

    .submit {
      min-height: 54px;
      border: 0;
      border-radius: 16px;
      color: white;
      background: var(--green);
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,98,65,.24);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .submit::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.28) 42%, transparent 62%);
      transform: translateX(-120%);
      animation: shine 3.4s ease-in-out infinite 1.1s;
    }
    .submit::after { content: "→"; display: inline-block; margin-left: 7px; transition: transform .2s ease; }
    .submit:hover { transform: translateY(-2px); background: #00754a; box-shadow: 0 12px 24px rgba(0,98,65,.28); }
    .submit:hover::after { transform: translateX(5px); }
    .submit:active { transform: translateY(0) scale(.98); }
    .submit:focus-visible, .share:focus-visible { outline: 3px solid rgba(0,98,65,.3); outline-offset: 3px; }

    .privacy { margin: -6px 0 0; text-align: center; color: var(--muted); font-size: 11px; }

    .success {
      display: none;
      min-height: 470px;
      padding: 44px 30px 34px;
      place-items: center;
      text-align: center;
    }
    .success.show { display: grid; animation: arrive .5s ease both; }
    .content.hide, .scene.hide { display: none; }
    .check {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      color: white;
      background: var(--green);
      box-shadow: 0 0 0 12px var(--green-soft);
      font-size: 38px;
      animation: pop .55s cubic-bezier(.2,.9,.2,1.25) both;
    }
    .success h2 { margin: 0; font-size: 31px; letter-spacing: -.04em; }
    .summary { margin: 12px auto 24px; max-width: 330px; color: var(--muted); line-height: 1.55; }
    .share {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--green);
      border-radius: 16px;
      background: white;
      color: var(--green);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .edit { margin-top: 14px; border: 0; background: transparent; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; min-height: 44px; }
    .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 5; overflow: hidden; }
    .confetti i { position: absolute; top: -20px; width: 9px; height: 15px; border-radius: 3px; animation: fall 2.2s ease-in forwards; }

    .ripple {
      position: fixed;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(0,98,65,.25);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      animation: tapRipple .65s ease-out forwards;
    }

    @keyframes arrive { from { opacity: 0; transform: translateY(20px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes cupIn { from { opacity: 0; transform: translateY(30px) rotate(-5deg); } to { opacity: 1; transform: none; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(10px) scale(.7); } 35% { opacity: .9; } 100% { opacity: 0; transform: translateY(-35px) translateX(8px) scale(1.2); } }
    @keyframes drift { to { translate: 12px -18px; rotate: 20deg; } }
    @keyframes aurora { to { transform: translate(12vmax, 8vmax) scale(1.18) rotate(18deg); } }
    @keyframes gridFlow { to { background-position: 0 30px, 30px 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .22; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.45); } }
    @keyframes hoverCup { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
    @keyframes cupShadow { 0%, 100% { transform: scale(1); opacity: .8; } 50% { transform: scale(.82); opacity: .5; } }
    @keyframes coffeeRipple { from { opacity: .8; transform: scale(.3); } to { opacity: 0; transform: scale(3.2); } }
    @keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes selected { 50% { transform: scale(1.04); } }
    @keyframes shine { 0%, 55% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
    @keyframes pop { from { opacity: 0; transform: scale(.35) rotate(-18deg); } to { opacity: 1; transform: none; } }
    @keyframes fall { to { transform: translate3d(var(--x), 110vh, 0) rotate(720deg); } }
    @keyframes tapRipple { to { opacity: 0; transform: scale(8); } }

    @media (max-width: 460px) {
      body { padding: 14px; align-items: start; }
      .scene { min-height: 180px; }
      .content { padding: 26px 20px 22px; }
      .row { grid-template-columns: 1fr; }
      .quick-days { grid-template-columns: 1fr 1fr; }
      .chip:last-child { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
      .card { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="aurora one"></span><span class="aurora two"></span>
    <span class="bean"></span><span class="bean"></span><span class="bean"></span><span class="bean"></span>
  </div>

  <main>
    <article class="card">
      <section class="scene" id="scene" aria-hidden="true">
        <div class="scene-grid"></div>
        <i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i>
        <div class="cup-wrap">
          <div class="steam"><span></span><span></span><span></span></div>
          <div class="coffee"></div>
          <div class="cup"></div>
        </div>
      </section>

      <section class="content" id="formView">
        <p class="eyebrow">Coffee + laptop rescue</p>
        <h1>When will you be at Starbucks?</h1>
        <p class="lead">Pick a time that works for you, and I’ll meet you there so we can fix your laptop.</p>

        <form id="meetupForm">
          <fieldset>
            <legend>Choose a day</legend>
            <div class="quick-days">
              <label class="chip"><input type="radio" name="quickDay" value="today"><span>Today</span></label>
              <label class="chip"><input type="radio" name="quickDay" value="tomorrow"><span>Tomorrow</span></label>
              <label class="chip"><input type="radio" name="quickDay" value="custom"><span>Another day</span></label>
            </div>
          </fieldset>

          <div class="row">
            <div>
              <label for="date">Date</label>
              <input id="date" type="date" required>
            </div>
            <div>
              <label for="time">Time</label>
              <input id="time" type="time" required>
            </div>
          </div>

          <div>
            <label for="location">Which Starbucks? <span style="font-weight:500;color:var(--muted)">(optional)</span></label>
            <input id="location" type="text" placeholder="Address or location name" autocomplete="street-address">
          </div>

          <button class="submit" type="submit">Send my time</button>
          <p class="privacy">Nothing is uploaded—your device opens Messages with the details ready to send.</p>
        </form>
      </section>

      <section class="success" id="successView" aria-live="polite">
        <div>
          <div class="check">✓</div>
          <h2>Perfect, see you there.</h2>
          <p class="summary" id="summary"></p>
          <button class="share" id="shareButton" type="button">Open Messages again</button>
          <button class="edit" id="editButton" type="button">Change my answer</button>
        </div>
      </section>
    </article>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script>
    const form = document.querySelector('#meetupForm');
    const dateInput = document.querySelector('#date');
    const timeInput = document.querySelector('#time');
    const locationInput = document.querySelector('#location');
    const formView = document.querySelector('#formView');
    const scene = document.querySelector('#scene');
    const successView = document.querySelector('#successView');
    const summary = document.querySelector('#summary');
    const shareButton = document.querySelector('#shareButton');
    const editButton = document.querySelector('#editButton');
    const quickDays = document.querySelectorAll('input[name="quickDay"]');
    const card = document.querySelector('.card');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let shareText = '';

    if (!reduceMotion) {
      document.addEventListener('pointermove', (event) => {
        document.documentElement.style.setProperty('--pointer-x', `${event.clientX}px`);
        document.documentElement.style.setProperty('--pointer-y', `${event.clientY}px`);

        if (event.pointerType === 'touch') return;
        const bounds = card.getBoundingClientRect();
        const inside = event.clientX >= bounds.left && event.clientX <= bounds.right && event.clientY >= bounds.top && event.clientY <= bounds.bottom;
        if (!inside) {
          card.classList.remove('tilting');
          card.style.transform = '';
          return;
        }
        const x = (event.clientX - bounds.left) / bounds.width;
        const y = (event.clientY - bounds.top) / bounds.height;
        card.classList.add('tilting');
        card.style.setProperty('--glare-x', `${x * 100}%`);
        card.style.setProperty('--glare-y', `${y * 100}%`);
        card.style.transform = `perspective(1100px) rotateX(${(0.5 - y) * 2.8}deg) rotateY(${(x - 0.5) * 3.5}deg) translateY(-2px)`;
      });

      document.addEventListener('pointerdown', (event) => {
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.left = `${event.clientX - 6}px`;
        ripple.style.top = `${event.clientY - 6}px`;
        document.body.append(ripple);
        window.setTimeout(() => ripple.remove(), 700);
      });
    }

    const toLocalISO = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const today = new Date();
    dateInput.min = toLocalISO(today);
    dateInput.value = toLocalISO(today);
    document.querySelector('input[value="today"]').checked = true;

    quickDays.forEach((radio) => {
      radio.addEventListener('change', () => {
        if (radio.value === 'custom') {
          dateInput.focus();
          if (typeof dateInput.showPicker === 'function') dateInput.showPicker();
          return;
        }
        const chosen = new Date();
        if (radio.value === 'tomorrow') chosen.setDate(chosen.getDate() + 1);
        dateInput.value = toLocalISO(chosen);
      });
    });

    dateInput.addEventListener('change', () => {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const match = dateInput.value === toLocalISO(today) ? 'today' : dateInput.value === toLocalISO(tomorrow) ? 'tomorrow' : 'custom';
      const radio = document.querySelector(`input[value="${match}"]`);
      if (radio) radio.checked = true;
    });

    const celebrate = () => {
      const colors = ['#006241', '#d4a574', '#f4eee5', '#7fb89f'];
      const container = document.querySelector('#confetti');
      container.replaceChildren();
      for (let index = 0; index < 28; index += 1) {
        const piece = document.createElement('i');
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[index % colors.length];
        piece.style.setProperty('--x', `${(Math.random() - .5) * 180}px`);
        piece.style.animationDelay = `${Math.random() * .35}s`;
        container.append(piece);
      }
      window.setTimeout(() => container.replaceChildren(), 2800);
    };

    const openMessages = () => {
      window.location.href = `sms:+19295981588&body=${encodeURIComponent(shareText)}`;
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const selected = new Date(`${dateInput.value}T${timeInput.value}`);
      const dateText = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(selected);
      const timeText = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(selected);
      const locationText = locationInput.value.trim();
      summary.textContent = `${dateText} at ${timeText}${locationText ? ` at ${locationText}` : ' at Starbucks'}.`;
      shareText = `I’ll be at ${locationText || 'Starbucks'} on ${dateText} at ${timeText}. See you then!`;

      formView.classList.add('hide');
      scene.classList.add('hide');
      successView.classList.add('show');
      celebrate();

      openMessages();
    });

    shareButton.addEventListener('click', openMessages);

    editButton.addEventListener('click', () => {
      successView.classList.remove('show');
      formView.classList.remove('hide');
      scene.classList.remove('hide');
      shareButton.textContent = 'Open Messages again';
    });
  </script>
</body>
</html>
